[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "macrodelta"
version = "0.1.0"
description = "Local semantic review of support macros after policy changes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["sentence-transformers>=5,<6", "socksio>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
macrodelta = "macrodelta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macrodelta"]
